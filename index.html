<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FlightDeck Checklist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div id="title">CHECKLIST</div>
  <div id="dots"></div>
  <div id="hstat">
    <span id="build" title="build version"></span>
    <span id="batt"></span>
    <span id="clock">--:--</span>
    <span id="net" title="online status">●</span>
    <button id="btnRefresh" title="check for the latest version" aria-label="update to latest version">⟳</button>
  </div>
</header>

<main>
  <section id="content"></section>
  <nav id="rail">
    <button id="btnUp" class="railbtn" aria-label="previous page">▲</button>
    <button id="btnCheck" class="railbtn check" aria-label="check item">CHECK</button>
    <button id="btnAdv" class="railbtn adv" aria-label="skip to next unchecked item">ADV</button>
    <button id="btnDown" class="railbtn" aria-label="next page">▼</button>
  </nav>
</main>

<div id="toast" hidden></div>

<script src="js/version.js"></script>
<script src="js/checklists.js"></script>
<script src="js/spotify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
